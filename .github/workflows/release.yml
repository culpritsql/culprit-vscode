name: Release Extension

on:
  push:
    branches: [main]
    tags: ["v*"]
  repository_dispatch:
    types: [upstream-pkg-published]
  schedule:
    - cron: "19 */6 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing v* tag to package, publish, and release on GitHub"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  package-and-publish:
    name: Package & Publish VSIX
    if: "!(github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[skip ci]'))"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - id: prepare
        name: Resolve upstream @culpritsql packages, build, test, and determine release version
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          git fetch --tags origin --force

          IS_EXPLICIT_TAG="false"
          if [ -n "$REQUESTED_TAG" ] || [[ "$EVENT_REF" == refs/tags/v* ]]; then
            IS_EXPLICIT_TAG="true"
          fi

          if [ "$IS_EXPLICIT_TAG" = "true" ]; then
            TAG="${REQUESTED_TAG:-${EVENT_REF#refs/tags/}}"
            VERSION="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
            [ "$TAG" = "v$VERSION" ] || { echo "::error::Tag $TAG does not match package.json version $VERSION"; exit 1; }
            bun install --frozen-lockfile || bun install
            ./node_modules/.bin/tsc --noEmit
            node scripts/build.mjs
            bun test
            printf 'should_publish=true\ntag=%s\nversion=%s\nneeds_git_push=false\n' "$TAG" "$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PLANS_LATEST="$(npm view @culpritsql/plans version)"
          VIEWER_LATEST="$(npm view @culpritsql/plan-viewer version)"
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependencies["@culpritsql/plans"] = `^${process.argv[1]}`;
            pkg.dependencies["@culpritsql/plan-viewer"] = `^${process.argv[2]}`;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          ' "$PLANS_LATEST" "$VIEWER_LATEST"
          bun install --no-cache

          PREV_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n1 || true)"
          CHANGED="false"
          if [ -z "$PREV_TAG" ]; then
            CHANGED="true"
          else
            if ! git diff --quiet "$PREV_TAG" -- package.json bun.lock; then
              CHANGED="true"
            elif ! git diff --quiet "$PREV_TAG" HEAD -- src/ scripts/ media/ assets/ README.md LICENSE; then
              CHANGED="true"
            fi
          fi

          if [ "$CHANGED" != "true" ]; then
            echo "No upstream @culpritsql updates or extension source changes since ${PREV_TAG}; skipping release."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ./node_modules/.bin/tsc --noEmit
          node scripts/build.mjs
          bun test

          NEXT_VERSION="$(node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const [cMaj, cMin, cPatch] = pkg.version.split(".").map(Number);
            const prev = process.argv[1];
            let next = pkg.version;
            if (prev) {
              const [tMaj, tMin, tPatch] = prev.replace(/^v/, "").split(".").map(Number);
              if (cMaj > tMaj || (cMaj === tMaj && cMin > tMin)) {
                next = `${cMaj}.${cMin}.${cPatch}`;
              } else {
                const p = (cMaj === tMaj && cMin === tMin) ? Math.max(tPatch + 1, cPatch) : tPatch + 1;
                next = `${tMaj}.${tMin}.${p}`;
              }
            }
            pkg.version = next;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            process.stdout.write(next);
          ' "$PREV_TAG")"

          printf 'should_publish=true\ntag=v%s\nversion=%s\nneeds_git_push=true\n' "$NEXT_VERSION" "$NEXT_VERSION" >> "$GITHUB_OUTPUT"
      - name: Commit and tag monotonic release on main
        if: steps.prepare.outputs.should_publish == 'true' && steps.prepare.outputs.needs_git_push == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="$AUTH_HEADER"

          git config user.name "culprit-bot"
          git config user.email "noreply@culpritsql.com"
          git add package.json bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${TAG} [skip ci]"
            git push origin HEAD:main
          fi
          git tag -a "$TAG" -m "Release ${VERSION}"
          git push origin "refs/tags/${TAG}"
      - name: Package VSIX and SHA256SUMS
        if: steps.prepare.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vsix"
          npx --yes @vscode/vsce@latest package --no-dependencies -o "$RUNNER_TEMP/vsix/culprit-sql-${VERSION}.vsix"
          (cd "$RUNNER_TEMP/vsix" && sha256sum ./*.vsix > SHA256SUMS.txt && sed 's| \./| |' -i SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish to VS Code Marketplace (OIDC Trusted Publishing)
        if: steps.prepare.outputs.should_publish == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${VSCE_PAT:-}" ]; then
            npx --yes @vscode/vsce@latest publish --skip-duplicate --packagePath "$RUNNER_TEMP/vsix/culprit-sql-${VERSION}.vsix" -p "$VSCE_PAT"
          else
            npx --yes @vscode/vsce@latest publish --skip-duplicate --packagePath "$RUNNER_TEMP/vsix/culprit-sql-${VERSION}.vsix" --oidc
          fi
      - name: Publish to Open VSX Registry (Cursor & Windsurf)
        if: steps.prepare.outputs.should_publish == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${OVSX_PAT:-}" ]; then
            npx --yes ovsx@latest create-namespace culpritsql -p "$OVSX_PAT" || true
            npx --yes ovsx@latest publish --skip-duplicate "$RUNNER_TEMP/vsix/culprit-sql-${VERSION}.vsix" -p "$OVSX_PAT"
          else
            echo "OVSX_PAT secret not configured; skipping Open VSX publish."
          fi
      - name: Create GitHub Release with VSIX
        if: steps.prepare.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; nothing to do."
            exit 0
          fi
          cd "$RUNNER_TEMP/vsix"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Culprit SQL for VS Code ${VERSION}" \
            --generate-notes \
            ./*
