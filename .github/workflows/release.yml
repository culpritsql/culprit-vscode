name: Release Extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to package, publish, and release on GitHub"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  package-and-publish:
    name: Package & Publish VSIX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - id: meta
        name: Verify release tag matches package version
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          TAG="${REQUESTED_TAG:-${EVENT_REF#refs/tags/}}"
          VERSION="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          [ "$TAG" = "v$VERSION" ] || { echo "::error::Tag $TAG does not match package.json version $VERSION"; exit 1; }
          printf 'tag=%s\nversion=%s\n' "$TAG" "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install dependencies, build, and test
        run: |
          set -euo pipefail
          bun install --frozen-lockfile || bun install
          ./node_modules/.bin/tsc --noEmit
          node scripts/build.mjs
          bun test
      - name: Package VSIX and SHA256SUMS
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vsix"
          bunx @vscode/vsce package --no-dependencies -o "$RUNNER_TEMP/vsix/culprit-sql-${VERSION}.vsix"
          (cd "$RUNNER_TEMP/vsix" && sha256sum ./*.vsix > SHA256SUMS.txt && sed 's| \./| |' -i SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ -n "${VSCE_PAT:-}" ]; then
            bunx @vscode/vsce publish --packagePath "$RUNNER_TEMP/vsix/culprit-sql-${VERSION}.vsix" -p "$VSCE_PAT"
          else
            echo "VSCE_PAT secret not configured; skipping VS Code Marketplace publish."
          fi
      - name: Publish to Open VSX Registry (Cursor & Windsurf)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ -n "${OVSX_PAT:-}" ]; then
            bunx ovsx publish "$RUNNER_TEMP/vsix/culprit-sql-${VERSION}.vsix" -p "$OVSX_PAT"
          else
            echo "OVSX_PAT secret not configured; skipping Open VSX publish."
          fi
      - name: Create GitHub Release with VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; nothing to do."
            exit 0
          fi
          cd "$RUNNER_TEMP/vsix"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Culprit SQL for VS Code ${VERSION}" \
            --generate-notes \
            ./*
